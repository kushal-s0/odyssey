[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "udyam-api"
version = "0.1.0"
description = "Evidence-linked business idea screening API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.143.3",
  "starlette==1.8.0",
  "pydantic==2.12.0",
  "pydantic-settings==2.11.0",
  "uvicorn==0.37.0",
  "psycopg[binary,pool]==3.2.10",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "pypdf==6.21.1",
  "av==16.0.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.2", "ruff==0.14.0", "mypy==1.18.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.pytest.ini_options]
testpaths = ["../../tests/api"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
