name: strive-cloud-cpu
services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile.llm
    restart: unless-stopped
    environment:
      STRIVE_CLOUD_SETUP: ${STRIVE_CLOUD_SETUP:?Set STRIVE_CLOUD_SETUP=yes on the remote CPU server only}
      LLAMA_API_KEY: ${CLOUD_SERVICE_TOKEN:?Set CLOUD_SERVICE_TOKEN in cloud-inference/.env}
    command:
      - --model-url
      - https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/3885219b6810b007914f3a7950a8d1b469d598a5/Qwen3.5-9B-Q4_K_M.gguf
      - --alias
      - Qwen/Qwen3.5-9B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-layers
      - "0"
      - --ctx-size
      - "16384"
      - --parallel
      - "1"
      - --threads
      - "4"
      - --jinja
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
      - --no-webui
      - --log-disable
    volumes:
      - llm-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 12g
  gateway:
    build: .
    restart: unless-stopped
    environment:
      CLOUD_SERVICE_TOKEN: ${CLOUD_SERVICE_TOKEN:?Set CLOUD_SERVICE_TOKEN in cloud-inference/.env}
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN after accepting IndicConformer access}
      INDIC_MODEL_REVISION: 2a77d305038dfc502fd9464e7d028b90381976cb
      LLM_URL: http://llm:8000
      LLM_TIMEOUT_SECONDS: "900"
      ASR_CPU_THREADS: "2"
    depends_on:
      llm:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - speech-models:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 12s
      start_period: 30m
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 8g
volumes:
  llm-models:
  speech-models:
