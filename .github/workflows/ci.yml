name: Local-build equivalent checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r apps/api/requirements-dev.lock
      - run: python -m pytest
        working-directory: apps/api
      - run: python -m ruff check app ../../tests/api
        working-directory: apps/api
      - run: python -m mypy app
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
