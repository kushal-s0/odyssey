services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports: ["127.0.0.1:8000:8000"]
    env_file: ["../.env.local"]
    environment:
      APP_ENV: development
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
